server {
    listen 80;
    server_name saigon.social;
    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANT: do NOT add a bare `types { application/wasm wasm; }` block here — an inline
    # `types` block *replaces* nginx's whole MIME map, so index.html would be served as
    # application/octet-stream and the browser would download it (as a random-named file)
    # instead of rendering it. nginx's default /etc/nginx/mime.types (included in the http
    # block) already maps text/html and application/wasm correctly, so we rely on that.

    # Long-cache the immutable, content-hashed assets.
    location ~* \.(js|wasm|css|woff2?|png|jpe?g|svg|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
